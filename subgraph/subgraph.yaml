specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: USDC
    network: base-sepolia
    source:
      address: "0x036CbD53842c5426634e7929541eC2318f3dCF7e"
      abi: USDC
      startBlock: 46600000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Transfer
        - Account
        - USDCActivity
        - USDCActivityHour
        - USDCActivityDay
      abis:
        - name: USDC
          file: ./abis/USDC.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
      file: ./src/usdc.ts
