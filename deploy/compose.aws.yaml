name: ringtree-aws
services:
  broker:
    image: ringtree:aws-arm64
    restart: unless-stopped
    ports: ["127.0.0.1:4318:4318"]
    environment:
      RINGTREE_RUNTIME: aws-ec2
    volumes:
      - /opt/ringtree/state/broker:/data
      - /opt/ringtree/state/keychain:/home/node/.local
      - /opt/ringtree/state/secrets:/run/ringtree-secrets:ro
    command: ["dbus-run-session", "--", "sh", "deploy/aws-broker-entry.sh"]
    networks: [agents, egress]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1536m
    pids_limit: 256
    logging: &logging
      driver: json-file
      options: { max-size: 5m, max-file: '2' }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4318/api/state').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  orchestrator: &agent
    image: ringtree:aws-arm64
    restart: unless-stopped
    command: ["npm", "run", "agent", "--", "start", "orchestrator"]
    environment:
      RINGTREE_BROKER_URL: http://broker:4318
      RINGTREE_ROLE_DIR: /identity
      RINGTREE_MANIFEST: /manifest.json
    volumes:
      - /opt/ringtree/state/agents/orchestrator:/identity
      - /opt/ringtree/state/agents/manifest.json:/manifest.json:ro
    networks: [agents]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 64
    logging: *logging
    depends_on:
      broker: { condition: service_healthy }
  researcher:
    <<: *agent
    command: ["npm", "run", "agent", "--", "start", "researcher"]
    volumes:
      - /opt/ringtree/state/agents/researcher:/identity
      - /opt/ringtree/state/agents/manifest.json:/manifest.json:ro
  risk:
    <<: *agent
    command: ["npm", "run", "agent", "--", "start", "risk"]
    volumes:
      - /opt/ringtree/state/agents/risk:/identity
      - /opt/ringtree/state/agents/manifest.json:/manifest.json:ro
  executor:
    <<: *agent
    command: ["npm", "run", "agent", "--", "start", "executor"]
    volumes:
      - /opt/ringtree/state/agents/executor:/identity
      - /opt/ringtree/state/agents/manifest.json:/manifest.json:ro
networks:
  agents: { internal: true }
  egress: {}
